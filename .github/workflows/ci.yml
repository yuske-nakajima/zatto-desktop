name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up development tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types, lint, and formatting
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Probe zatto server in development build
        run: pnpm smoke:dev
      - name: Create application package
        run: pnpm make
