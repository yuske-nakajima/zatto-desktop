name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up development tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types, lint, and formatting
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Probe zatto server in development build
        run: pnpm smoke:dev
      - name: Create application package
        run: pnpm make
      - name: Probe zatto server in packaged application
        run: pnpm smoke:packaged
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zatto-windows-installer
          path: apps/desktop/out/make/squirrel.windows/x64/zatto-Setup.exe
          if-no-files-found: error
