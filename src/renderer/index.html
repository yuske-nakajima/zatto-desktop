<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>zatto</title>
  </head>
  <body>
    <main
      class="preparation"
      aria-labelledby="preparation-title"
      data-screen="preparation"
    >
      <p class="eyebrow">zatto</p>
      <h1 id="preparation-title">Getting things ready</h1>
      <p class="description">
        The application shell is ready for the zatto server connection.
      </p>
    </main>
    <main
      class="preparation"
      aria-labelledby="error-title"
      data-screen="error"
      role="alert"
      hidden
    >
      <p class="eyebrow">zatto</p>
      <h1 id="error-title">zatto could not start</h1>
      <p class="description">Close the application and try again.</p>
    </main>
  </body>
</html>
