<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Zatto Desktop</title>
  </head>
  <body>
    <main class="preparation" aria-labelledby="preparation-title">
      <p class="eyebrow">Zatto Desktop</p>
      <h1 id="preparation-title">Getting things ready</h1>
      <p class="description">
        The application shell is ready for the zatto server connection.
      </p>
      <p class="error" data-error-message role="alert" hidden>
        Zatto Desktop could not display this screen. Close the application and
        try again.
      </p>
    </main>
  </body>
</html>
