packages:
  - apps/*

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

blockExoticSubdeps: false

minimumReleaseAgeExclude:
  - "@yuske-nakajima/zatto@0.1.3"
  - electron-to-chromium@1.5.401
  - electron@43.3.0
  - ipaddr.js@2.5.0
  - node-releases@2.0.52
  - terser@5.49.1

nodeLinker: hoisted

overrides:
  "@xmldom/xmldom@>=0.9.0-beta.1 <=0.9.11": ^0.9.12
  body-parser@<1.20.9: ^1.20.9
  brace-expansion@<1.1.21: ^1.1.21
  compression@<1.8.2: ^1.8.2
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  "fast-uri@>=4.0.0 <4.2.3": "4.2.3"
  follow-redirects@>=1.16.0 <=1.16.1: ^1.16.2
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  launch-editor@<=2.14.1: ^2.14.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  nanoid@<3.3.18: ^3.3.18
  postcss-selector-parser@>=7.0.0 <7.1.6: ^7.1.6
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.7.0 <=6.16.0: ^6.16.1
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  undici@>=7.0.0 <7.30.1: ^7.30.1
  uuid@<11.1.1: ^11.1.1
  vite@>=8.2.0 <=8.2.3: ^8.2.4
